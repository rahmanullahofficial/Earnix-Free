<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0d18;--c:#121829;--b:#1e2740;--p:#7c5cff;--a:#3b82f6;--t:#8d97b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;padding:0 14px 90px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--p));display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%}
.logo{font-weight:800;font-size:20px;flex:1}.logo b{color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#1b2a5e,#3a2a7a 60%,#1c1f46);position:relative;overflow:hidden}
.hero:after{content:"💎";position:absolute;right:16px;top:16px;font-size:44px}
.lbl{color:var(--t);font-size:12px;letter-spacing:1px}
.big{font-size:40px;font-weight:800;margin:4px 0}
.chip{display:inline-block;background:#ffffff1a;border-radius:20px;padding:4px 10px;font-size:12px;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px 6px;text-align:center;font-size:13px}
.tile i{display:block;font-size:24px;font-style:normal;margin-bottom:4px}
.bar{height:10px;background:#ffffff14;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar div{height:100%;background:linear-gradient(90deg,var(--a),var(--p));border-radius:8px;transition:width .6s}
button,input{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:600;margin-top:10px;color:#fff}
button{background:linear-gradient(90deg,var(--a),var(--p))}button:disabled{opacity:.5}
input{background:var(--bg);border:1px solid var(--b);font-weight:400}
h3{margin:18px 0 10px;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:10px}
.ti{width:42px;height:42px;border-radius:12px;background:#ffffff12;display:grid;place-items:center;font-size:20px;flex:none}
.pts{color:#4ade80;font-size:13px;font-weight:600}
.b2{width:auto;margin:0;padding:9px 14px;font-size:13px}.b2.g{background:#ffffff14}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1222ee;backdrop-filter:blur(10px);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{flex:1;text-align:center;font-size:11px;color:var(--t);padding:6px 0;border-radius:12px}
nav div i{display:block;font-size:20px;font-style:normal}
nav .on{color:#fff;background:#7c5cff30}
.wrap{position:relative;width:260px;height:260px;margin:10px auto}
#w{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.8,.2,1)}
.ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:26px;z-index:2}
.hub{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--bg);border:3px solid var(--p);display:grid;place-items:center}
</style></head><body>
<div class=top id=hd></div><div id=v>Loading…</div><nav id=n></nav>
<script>
const LINK='https://t.me/EarnixFree_bot/app?startapp=';
const MIN=5000,PR=[0,1,20,40,60,100],COL=['#4aa8ff','#f5a623','#2ecc71','#4b5563','#7c5cff','#e84393'];
const tg=Telegram.WebApp;tg.ready();tg.expand();
const U=tg.initDataUnsafe.user||{first_name:'User'};
const api=async(action,x={})=>{const r=await fetch('/api/app',{method:'POST',headers:{'content-type':'application/json'},
 body:JSON.stringify({initData:tg.initData,action,...x})});return r.json()};
let S,tab='Home',rot=0;
const TABS=[['Home','🏠'],['Tasks','✅'],['Spin','🎡'],['Wallet','👛'],['Profile','👤']];
const go=t=>{tab=t;draw()};
const load=async(a='me',x={})=>{const r=await api(a,x);if(r.error)tg.showAlert(r.error);if(r.me){S=r;draw()}return r};
const av=()=>`<div class=av>${U.photo_url?`<img src="${U.photo_url}">`:U.first_name[0]}</div>`;
function wheel(){let s='';const c=130,R=120;
 PR.forEach((p,i)=>{const f=d=>(d-90)*Math.PI/180,a0=f(i*60),a1=f(i*60+60),am=f(i*60+30);
  s+=`<path d="M${c} ${c}L${c+R*Math.cos(a0)} ${c+R*Math.sin(a0)}A${R} ${R} 0 0 1 ${c+R*Math.cos(a1)} ${c+R*Math.sin(a1)}Z" fill="${COL[i]}" stroke="#0a0d18" stroke-width="2"/>
  <text x="${c+80*Math.cos(am)}" y="${c+80*Math.sin(am)}" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">${p}</text>`});
 return `<svg id=w viewBox="0 0 260 260" style="transform:rotate(${rot}deg)">${s}</svg>`}
function draw(){const m=S.me,pc=Math.min(100,Math.round(m.points/MIN*100));
 hd.innerHTML=`${av()}<div class=logo>Earn<b>ix</b></div><span class=chip>⭐ ${m.points}</span>`;
 n.innerHTML=TABS.map(([t,i])=>`<div class="${t==tab?'on':''}" onclick="go('${t}')"><i>${i}</i>${t}</div>`).join('');
 const pages={
 Home:`<div class="card hero"><div class=lbl>TOTAL POINTS</div><div class=big>${m.points}</div>
  <span class=chip>👥 ${m.refs} referrals</span><span class=chip>🎟 ${m.spins} spins</span></div>
  <div class=grid><div class=tile onclick="go('Tasks')"><i>✅</i>Tasks</div><div class=tile onclick="go('Spin')"><i>🎡</i>Spin</div><div class=tile onclick="go('Wallet')"><i>👛</i>Wallet</div></div>
  <div class=card><b>Progress to first withdrawal</b><div class=bar><div style="width:${pc}%"></div></div>
  <small style="color:var(--t)">${m.points} / ${MIN} points (${pc}%)</small></div>`,
 Tasks:`<h3>Today's tasks</h3>`+S.tasks.map(t=>{const d=S.done.includes(t.id),ic=/youtube/.test(t.url)?'▶️':'✈️';
  return `<div class=card><div class=row><div class=ti>${ic}</div><div style="flex:1"><b>${t.title}</b><div class=pts>+${t.reward} points</div></div></div>
  ${d?'<div class=pts style="margin-top:8px">✅ Completed</div>':`<div class=row style="margin-top:10px"><button class="b2 g" onclick="tg.openLink('${t.url}')">Open</button><button class=b2 onclick="load('task',{taskId:${t.id}})">Verify</button></div>`}</div>`}).join(''),
 Spin:`<div class=card style=text-align:center><h3 style="margin-top:0">Daily reward</h3><div class=wrap><div class=ptr>🔻</div>${wheel()}<div class=hub>✨</div></div>
  <div class=lbl>Chances left: ${m.spins}</div><button id=sp onclick=spin()>${m.spins>0?'Spin the wheel':'Spin for 30 points'}</button></div>`,
 Wallet:`<div class="card hero"><div class=lbl>BALANCE</div><div class=big>${m.points}</div><span class=chip>Min withdraw ${MIN}</span></div>
  <div class=card><b>Withdraw</b><input id=ad placeholder="Your wallet address"><button onclick="load('withdraw',{address:ad.value})">Request withdrawal</button></div>
  <div class=card><b>Withdrawal history</b>${S.withdrawals.map(w=>`<div class=row><span>${w.points} pts</span><span class=pts>${w.status}</span></div>`).join('')||'<div style="color:var(--t);margin-top:8px">No requests yet</div>'}</div>`,
 Profile:`<div class=card style=text-align:center><div style="display:flex;justify-content:center">${av()}</div><h3 style="margin:10px 0 4px">${U.first_name}</h3>
  <span class=chip>⭐ ${m.points} points</span><span class=chip>👥 ${m.refs} referrals</span>
  <button onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(LINK+U.id))">Invite friends</button></div>
  <div class=card><b>🏆 Leaderboard</b>${S.top.map((u,i)=>`<div class=row><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${u.name}</span><b>${u.points}</b></div>`).join('')}</div>`};
 v.innerHTML=pages[tab]}
async function spin(){sp.disabled=true;const r=await api('spin');if(r.error){tg.showAlert(r.error);sp.disabled=false;return}
 rot+=360*5+(360-(rot%360))-(r.prize*60+30);w.style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{S=r;draw();tg.HapticFeedback?.notificationOccurred('success')},4400)}
load();
</script></body></html>
